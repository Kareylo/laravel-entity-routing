name: quality

on:
  push:
  pull_request:

jobs:
  quality:
    name: Larastan and Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:13.*" "illuminate/routing:13.*" "illuminate/support:13.*" --no-interaction --no-update
          composer require "orchestra/testbench:11.*" --dev --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pint
        run: vendor/bin/pint --test
