name: quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php: '8.4'
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:13.*" "illuminate/routing:13.*" "illuminate/support:13.*" --no-interaction --no-update
          composer require "orchestra/testbench:11.*" --dev --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --no-interaction

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pint
        run: vendor/bin/pint --test
