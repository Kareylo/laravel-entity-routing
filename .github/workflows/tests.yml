name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - { laravel: '10.*', testbench: '8.*' }
          - { laravel: '11.*', testbench: '9.*' }
          - { laravel: '12.*', testbench: '10.*' }
          - { laravel: '13.*', testbench: '11.*' }
        exclude:
          # Laravel 10 supports PHP 8.1 to 8.3
          - { laravel: '10.*', php: '8.4' }
          - { laravel: '10.*', php: '8.5' }
          # Laravel 11 supports PHP 8.2 to 8.4
          - { laravel: '11.*', php: '8.1' }
          - { laravel: '11.*', php: '8.5' }
          # Laravel 12 supports PHP 8.2 to 8.5
          - { laravel: '12.*', php: '8.1' }
          # Laravel 13 supports PHP 8.3 to 8.5
          - { laravel: '13.*', php: '8.1' }
          - { laravel: '13.*', php: '8.2' }

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" "illuminate/routing:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
