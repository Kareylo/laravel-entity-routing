name: coverage

on:
  push:
  pull_request:

jobs:
  coverage:
    name: Coverage (minimum 80%)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          coverage: pcov

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:13.*" "illuminate/routing:13.*" "illuminate/support:13.*" --no-interaction --no-update
          composer require "orchestra/testbench:11.*" --dev --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests with coverage
        run: vendor/bin/pest --coverage --min=80 --coverage-clover=build/coverage/clover.xml --coverage-html=build/coverage/html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/coverage
