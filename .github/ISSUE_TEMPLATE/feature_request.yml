name: Feature request
description: Suggest a new capability or a change in behavior.
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current package does not cover it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API you would like to use, with a code example.
      render: php
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other approaches.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This does not require a new runtime dependency, or I explain why one is needed above.
          required: true
